<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="EXPLODER, Studio EXPLODER, Slippery Wizards, Portland, Oregon, Indie Game, Indie Board Game, Game, Board Game, Game Studio">
    <meta name="description" content="EXPLODER is the indie game studio behind SLIPPERY WIZARDS!">
    <title>Studio EXPLODER</title>
    <style>
        body {
            background-color: rgb(63,169,245);
            color: white;
            font-family:monospace;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 30px;
            gap: clamp(10px, 2vw, 15px)
        }
        h1 {
            text-align: center;
            color: white;
        }
        p {
            color: white;
        }
        .main-content { 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            width: 100%; 
        } 
        a {
            color: white;
        }
        input::selection {
            background: rgb(63,169,245);
            color: white;
        }
        input::-moz-selection {
            background: rgb(63,169,245);
            color: white;
        }
        .logo-container {
            width: 35%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .logo-container {
            width: 60%;
            }
        }
        @media (max-width: 600px) {
            .logo-container {
            width: 85%;
            }
        }
        .logo-container img,
        .logo-container form,
        .logo-container input {
            width: 100%;
            box-sizing: border-box;
        }
        #logo {
            cursor: pointer;
        }
        .inverted {
            filter: invert(1);
        }
        body.inverted {
            background-color: white;
            color: black;
        }
        .navigation {
            width: 100%;
            display: flex;
            justify-content: center;
            box-sizing: border-box;
        }
        .navigation h1 {
            margin: 0;
            font-size: x-large;
        }
        .games {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 0;
        }

        .games {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .games a {
            width: calc((100% - 20px) / 3);
            display: block;
            text-decoration: none;
        }

        .games .game {
            display: block;
            width: 100% !important;
            height: auto;
        }
        .contact {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 15px;
            padding-top: 25px;
        }
        .footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        form input {
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            font-family: monospace;
            color: rgb(63,169,245);
        }
        form input::placeholder {
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="main-content"> 
        <div class="logo-container"> 
            <div class="navigation"> 
                <h1>-a game studio in Portland, Oregon-</h1> 
            </div> 
            <img id="logo" src="assets/ExploderLogo-WHITE.svg" alt="EXPLODER Logo"> 
            <form action="/subscribe" method="POST"> 
                <input type="email" id="email" name="email" placeholder="feed your email to our newsletter" required > 
            </form> 

            <div class="games"> 
                    <a href="https://www.kickstarter.com/projects/largehotcoffee/slippery-wizards">
                    <img 
                    class="game" 
                    src="assets/SlipperyWizardsIcon-01.png" 
                    alt="Slippery Wizards Icon">
                    </a>
                    <a href="https://www.kickstarter.com/projects/largehotcoffee/slippery-wizards">
                    <img 
                    class="game" 
                    src="assets/SlipperyWizardsIcon-01.png" 
                    alt="Slippery Wizards Icon">
                    </a>
                    <a href="https://www.kickstarter.com/projects/largehotcoffee/slippery-wizards">
                    <img 
                    class="game" 
                    src="assets/SlipperyWizardsIcon-01.png" 
                    alt="Slippery Wizards Icon">
                    </a>
                    <a href="https://www.kickstarter.com/projects/largehotcoffee/slippery-wizards">
                    <img 
                    class="game" 
                    src="assets/SlipperyWizardsIcon-01.png" 
                    alt="Slippery Wizards Icon">
                    </a>
                    <a href="https://www.kickstarter.com/projects/largehotcoffee/slippery-wizards">
                    <img 
                    class="game" 
                    src="assets/SlipperyWizardsIcon-01.png" 
                    alt="Slippery Wizards Icon">
                    </a>
            </div>
            
        </div> 

        <div class="contact">
            <a href="https://www.instagram.com/studio_exploder"> instagram </a>
            <a> | </a>
            <a href="mailto:chrishenagerdesign@gmail.com"> e-mail us </a> 
        </div>

        <div class="footer">
            <p>&copy; all rights reserved EXPLODER, LLC 2026</p> 
        </div>
    </div>

    <script>
        const logo = document.getElementById("logo");

        const originalImage = "assets/ExploderLogo-WHITE.svg";
        const newImage = "assets/ExploderLogo-WHITE-FROWN.svg";
        
        logo.addEventListener("click", function () {
            if (logo.src.includes("ExploderLogo-WHITE.svg")) {
                logo.src = newImage;
            } else {
                logo.src = originalImage;
            }
            document.body.classList.toggle("inverted");
        });
    </script>

</body>
</html>
